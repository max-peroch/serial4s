name: Windows

# The Windows backend has never run on Windows. This runs the whole test suite
# on a Windows runner, which has no COM port: the opt-in WindowsPortSuite skips
# itself (it needs FS2_SERIAL_TEST_PORT). So it checks that kernel32 loads and
# binds, and that the pure and fake-based tests pass there. It cannot check a
# real port.
#
# continue-on-error is on until this has gone green once; then remove it, so a
# failure blocks a merge.
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows (Java 25)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Test
        run: sbt testFull
