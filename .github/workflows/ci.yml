name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    # The Linux backend needs glibc 2.42 or newer, and ubuntu-latest has an
    # older one. So the tests run in Docker on Ubuntu 25.10, as they do on a
    # developer machine: format checks, every test as root, then the permission
    # suites as a normal user.
    name: Linux (glibc 2.42, in Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test
        run: ./docker/test-linux.sh

  macos:
    name: macOS (Java 25)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Check formatting
        run: sbt "scalafmtSbtCheck;scalafmtCheckAll"

      - name: Test
        run: sbt testFull

      - name: Generate documentation
        run: sbt doc

      # Before 1.0 a release may break compatibility, so this reports and does
      # not fail the build.
      - name: Report binary compatibility with the last release
        continue-on-error: true
        run: sbt mimaReportBinaryIssues

  windows:
    # The Windows backend has never run on Windows. A Windows runner has no COM
    # port, so the opt-in WindowsPortSuite skips itself (it needs
    # FS2_SERIAL_TEST_PORT). This checks that kernel32 loads and binds, and that
    # the tests that need no port pass there. It cannot check a real port.
    # continue-on-error stays on until this has gone green once; then remove
    # it, so a failure blocks a merge.
    name: Windows (Java 25)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Test
        run: sbt testFull

  publish:
    name: Publish Artifacts
    # Only on a version tag, and only once Linux and macOS pass. Windows is not
    # required while it is allowed to fail.
    needs: [linux, macos]
    if: github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full, for the version from the tag)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          cache: sbt

      - name: Setup sbt
        uses: sbt/setup-sbt@v1

      - name: Publish
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
